<div class="container py-5">

    <h3 class="fw-bold text-primary mb-3">Cesta</h3>

    <div class="alert alert-warning rounded-3 shadow-sm" *ngIf="mensagem.length>0">
        {{mensagem}}
    </div>

    <br>

<div class="table-responsive">

    <table class="table align-middle mb-0 border border-2 rounded-4 overflow-hidden">

        <!-- CABEÇALHO -->
        <thead>
            <tr class="bg-light border-bottom border-2 border-primary">

                <td class="py-3 px-3"></td>

                <td class="fw-bold py-3 px-3">
                    Produto
                </td>

                <td class="fw-bold text-center text-nowrap py-3 px-3">
                    Quantidade
                </td>

                <td class="fw-bold text-center text-nowrap py-3 px-3">
                    Valor
                </td>

                <td class="py-3 px-3"></td>

            </tr>
        </thead>

        <!-- PRODUTOS -->
        <tbody>

            <tr *ngFor="let obj of lista" class="border-bottom border-1 border-primary">

                <!-- IMAGEM -->
                <td class="text-center px-3 py-4">

                    <div
                        class="d-flex align-items-center justify-content-center bg-white border border-2 rounded-4 mx-auto"
                        style="width: 90px; height: 90px;"
                    >
                        <img
                            src="/{{obj.produto.codigo}}.png"
                            class="img-fluid"
                            style="width: 72px; height: 72px; object-fit: contain;"
                        >
                    </div>

                </td>

                <!-- PRODUTO -->
                <td class="py-4 px-3">

                    <div class="fw-bold fs-6 mb-1">
                        {{obj.produto.nome}}
                    </div>

                    <small
                        class="text-muted d-block"
                        style="max-width: 450px;"
                    >
                        {{obj.produto.descritivo}}
                    </small>

                </td>

                <!-- QUANTIDADE -->
                <td class="text-center text-nowrap py-4 px-3">

                    <div
                        class="d-inline-flex align-items-center justify-content-center border border-2 rounded-3 bg-light px-3 py-2"
                    >
                        <span class="fw-bold">
                            {{obj.qtd}}
                        </span>
                    </div>

                    <!-- FUNÇÃO PARA AUMENTAR QUANTIDADE DE ITEMS,
                         NÃO ATIVAR ATÉ QUE SEJA RESOLVIDO

                    <span
                        class="badge bg-primary rounded-pill px-3 py-2"
                        (click)="aumentaQuantidade(obj)"
                    >
                        +
                    </span>

                    -->

                </td>

                <!-- VALOR -->
                <td class="text-center text-nowrap py-4 px-3">

                    <span class="fw-bold fs-6">
                        R$ {{obj.valorTotal | number:'1.2-2' }}
                    </span>

                </td>

                <!-- REMOVER -->
                <td class="text-center px-3 py-4">

                    <button
                        class="btn btn-outline-danger rounded-3 fw-bold d-inline-flex align-items-center justify-content-center"
                        style="width: 40px; height: 40px;"
                    >
                        ×
                    </button>

                </td>

            </tr>

        </tbody>

        <!-- TOTAL -->
        <tfoot>

            <tr class="bg-light border-top border-2 border-primary">

                <td colspan="3" class="text-end py-4 px-3">

                    <span class="fw-semibold">
                        Total da cesta
                    </span>

                </td>

                <td class="text-center text-nowrap py-4 px-3">

                    <span class="fw-bold fs-5 text-primary">
                        R$ {{valorCesta | number:'1.2-2'}}
                    </span>

                </td>

                <td></td>

            </tr>

        </tfoot>

    </table>

</div>


    <div class="d-flex flex-column flex-sm-row gap-3 mt-4">

        <button class="btn btn-outline-danger flex-sm-fill rounded-3 py-3 fw-semibold">
            Limpar cesta
        </button>

        <button class="btn btn-outline-primary flex-sm-fill rounded-3 py-3 fw-semibold">
            Continuar comprando
        </button>

        <button class="btn btn-primary flex-sm-fill rounded-3 py-3 fw-semibold shadow-sm">
            Gravar pedido
        </button>

    </div>

</div>
