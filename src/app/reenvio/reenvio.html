<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-primary mb-0">
                    Esqueci a senha
                </h2>
                <a href="login" class="text-decoration-none fw-semibold">
                    Voltar para o login
                </a>
            </div>

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-sm-5">
                    <div class="mb-4 border-1 border-bottom border-primary">
                        <p class="fw-semibold text-primary fs-4 mb-2">
                            Informe seu e-mail
                        </p>
                    </div>
                    <div class="mb-4">
                        <label for="txtEmail" class="form-label fw-semibold">
                            E-mail
                        </label>
                        <input type="email" id="txtEmail"
                            class="form-control form-control-lg rounded-3 border border-primary"
                            placeholder="Digite seu e-mail">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold py-3">
                        Enviar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
