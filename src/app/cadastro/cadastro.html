<h3>Cadastro</h3>
<div class="alert alert-success">Cadastro atualizado</div>
<form class="was-validated">
    <label class="form-label">nome:</label>
    <input type="text" id="txtNome" class="form-control" required>
    <div class="invalid-feedback">Nome é obrigatório!</div>

    <label class="form-label">documento:</label>
    <input type="text" id="txtDocumento" class="form-control" required>
    <div class="invalid-feedback">Documento é obrigatório!</div>

    <label class="form-label">e-mail:</label>
    <input type="email" id="txtEmail" class="form-control" required>
    <div class="invalid-feedback">email é obrigatório!</div>

    <label class="form-label">senha:</label>
    <input type="password" id="txtSenha" class="form-control" required
    pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$">
    <div class="invalid-feedback">A senha deve conter pelo menos 8 caracteres, incluindo uma letra maiúscula, uma letra minúscula, um número e um caractere especial (@$!%*?&).</div>

    <label class="form-label">telefone:</label>
    <input type="text" id="txtTelefone" class="form-control" required 
    pattern="[0-9]{4,5}-[0-9]{4}">
    <div class="invalid-feedback">Informe um telefone valido!</div>

    <label class="form-label">endereço:</label>
    <textarea id="txtTelefone" class="form-control" required rows="5">
        </textarea>
    <div class="invalid-feedback">Informe um endereço completo!</div>

    <br><button class="btn btn-success w-100">gravar</button>

</form>
